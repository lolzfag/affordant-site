<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="A small group of researchers building the universal physical intelligence layer for all robotics.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Affordant">
<meta property="og:title" content="Affordant">
<meta property="og:description" content="A small group of researchers building the universal physical intelligence layer for all robotics.">
<meta name="theme-color" content="#0b0b0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='%23ece9e1'/%3E%3Crect x='6' y='5.5' width='2.6' height='10' rx='1.3' fill='%230b0b0a'/%3E%3Crect x='15.4' y='5.5' width='2.6' height='10' rx='1.3' fill='%230b0b0a'/%3E%3Ccircle cx='12' cy='15.2' r='2.7' fill='%23d6f24a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* EDIT ME: the contact address is  hello@affordant.io  (appears twice). */
:root {
  --bg: #0b0b0a;
  --ink: #ece9e1;
  --ink-2: #9a968d;
  --ink-3: #5f5c55;
  --line: rgba(236, 233, 225, 0.12);
  --accent: #d6f24a;
  --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100svh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: var(--bg); }

canvas#field {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
.glow {
  position: fixed; z-index: 0; pointer-events: none;
  width: 70vmax; height: 70vmax; right: -20vmax; top: 50%; transform: translateY(-50%);
  background: radial-gradient(closest-side, rgba(214, 242, 74, 0.05), transparent 70%);
}
.vignette {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 100% at 30% 50%, transparent 40%, rgba(11, 11, 10, 0.75) 100%);
}

.page {
  position: relative; z-index: 1;
  min-height: 100svh;
  display: flex; flex-direction: column;
  padding: clamp(22px, 3.2vw, 40px) clamp(20px, 4vw, 48px);
}

.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand svg { width: 20px; height: 20px; }
.brand span { font-size: 12.5px; letter-spacing: 0.18em; color: var(--ink); }
.top .mono { text-align: right; }

.hero {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  padding: clamp(64px, 12vh, 140px) 0;
  max-width: 980px;
}
.eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; color: var(--ink-2); }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(214, 242, 74, 0.7); }
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(36px, 5.4vw, 66px);
  line-height: 1.06;
  letter-spacing: -0.012em;
  text-wrap: balance;
  max-width: 22ch;
}
h1 em { font-style: italic; }
.sub { margin: 36px 0 0; color: var(--ink-2); max-width: 64ch; font-size: 12.5px; line-height: 1.9; }

.foot {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
  padding-top: 24px; border-top: 1px solid var(--line);
}
.foot .mail { font-family: var(--serif); font-size: 20px; letter-spacing: 0; text-transform: none; color: var(--ink); position: relative; }
.foot .mail::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1px;
  background: var(--ink-3); transform-origin: left; transition: background 0.4s var(--ease), transform 0.5s var(--ease);
}
.foot .mail:hover::after { background: var(--accent); }

/* reveal: blur → sharp */
@media (prefers-reduced-motion: no-preference) {
  .r { opacity: 0; filter: blur(8px); transform: translateY(6px); animation: focus 1.4s var(--ease) forwards; }
  .top.r { animation-delay: 0.1s; }
  .eyebrow.r { animation-delay: 0.35s; }
  h1.r { animation-delay: 0.5s; }
  .sub.r { animation-delay: 0.85s; }
  .foot.r { animation-delay: 1.05s; }
  @keyframes focus { to { opacity: 1; filter: blur(0); transform: none; } }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="page">
  <header class="top r">
    <a class="brand" href="/" aria-label="Affordant">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="#ece9e1"/><rect x="6" y="5.5" width="2.6" height="10" rx="1.3" fill="#0b0b0a"/><rect x="15.4" y="5.5" width="2.6" height="10" rx="1.3" fill="#0b0b0a"/><circle cx="12" cy="15.2" r="2.7" fill="#d6f24a"/></svg>
      <span>AFFORDANT</span>
    </a>
    <p class="mono">Oxford &middot; Cambridge &middot; Tsinghua</p>
  </header>

  <main class="hero">
    <p class="mono eyebrow r">Research lab &middot; 2026</p>
    <h1 class="r">A small group of researchers building the <em>universal physical intelligence layer</em> for all robotics.</h1>
    <p class="mono sub r">We are heads-down. Correspondence by email.</p>
  </main>

  <footer class="foot r">
    <p class="mono">&copy; 2026 Affordant</p>
    <a class="mail" href="mailto:hello@affordant.io">hello@affordant.io</a>
  </footer>
</div>

<script>
(() => {
  const c = document.getElementById("field");
  const ctx = c.getContext("2d", { alpha: true });
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = 1600, pts = [];
  // Fibonacci sphere
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = Math.PI * (3 - Math.sqrt(5)) * i;
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
  }
  let W, H, DPR;
  const resize = () => { DPR = Math.min(devicePixelRatio || 1, 2); W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR; };
  resize(); addEventListener("resize", resize);

  const frame = (t) => {
    ctx.clearRect(0, 0, W, H);
    const narrow = W / DPR < 720;
    const R = Math.min(W, H) * (narrow ? 0.55 : 0.46);
    const cx = narrow ? W * 0.6 : W * 0.74, cy = H * 0.5;
    const a = t * 0.00009, b = 0.35 + Math.sin(t * 0.00004) * 0.25;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
    for (let i = 0; i < N; i++) {
      const p = pts[i];
      const x = p[0] * ca + p[2] * sa, z = -p[0] * sa + p[2] * ca;
      const y = p[1] * cb - z * sb, z2 = p[1] * sb + z * cb;
      const d = (z2 + 1) / 2;                       // 0 back → 1 front
      const alpha = narrow ? 0.03 + d * 0.18 : 0.05 + d * 0.42;
      const s = (0.6 + d * 1.5) * DPR;
      ctx.fillStyle = `rgba(236,233,225,${alpha})`;
      ctx.fillRect(cx + x * R, cy + y * R, s, s);
    }
    if (!reduce) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
